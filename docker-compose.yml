services:
  app:
    build:
      context: .
      target: production-main
      dockerfile: Dockerfile
    ports:
      - "5900-5907:3000"
    env_file:
      - website/.env
    depends_on:
      - websocket
    restart: unless-stopped
    networks:
      - shared_backend
    deploy:
      replicas: 8

  websocket:
    build:
      context: .
      target: production-websocket
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    env_file:
      - website/.env
    restart: unless-stopped
    networks:
      - shared_backend

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - app
      - websocket
    networks:
      - shared_backend

networks:
  shared_backend:
    external: true

volumes:
  caddy_data:
  caddy_config: