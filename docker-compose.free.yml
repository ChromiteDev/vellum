services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vellum
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vellum"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: production-main
      dockerfile: Dockerfile
      args:
        PUBLIC_BETTER_AUTH_URL: ${PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
        PUBLIC_WEBSOCKET_URL: ${PUBLIC_WEBSOCKET_URL:-ws://localhost:8080}
        PUBLIC_B2_BUCKET: ${PUBLIC_B2_BUCKET:-}
        PUBLIC_B2_ENDPOINT: ${PUBLIC_B2_ENDPOINT:-}
        PUBLIC_B2_REGION: ${PUBLIC_B2_REGION:-}
        PUBLIC_POLAR_PRODUCT_GEMS_500: ${PUBLIC_POLAR_PRODUCT_GEMS_500:-}
        PUBLIC_POLAR_PRODUCT_GEMS_1300: ${PUBLIC_POLAR_PRODUCT_GEMS_1300:-}
        PUBLIC_POLAR_PRODUCT_GEMS_2800: ${PUBLIC_POLAR_PRODUCT_GEMS_2800:-}
        PUBLIC_POLAR_PRODUCT_GEMS_8000: ${PUBLIC_POLAR_PRODUCT_GEMS_8000:-}
        PUBLIC_GOOGLE_ENABLED: ${PUBLIC_GOOGLE_ENABLED:-false}
    env_file:
      - website/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vellum
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  websocket:
    build:
      context: .
      target: production-websocket
      dockerfile: Dockerfile
    env_file:
      - website/.env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared
    depends_on:
      - app
      - websocket
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
